<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work Tasks</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const SCRIPT_URL = "https://script.google.com/a/macros/betfanatics.com/s/AKfycbz6gioWlwp-V7vqvYP2lOfoNECTJCpPby1CCow1uA5K-6szXzf8A3q0lg7FhutO539FoQ/exec";
const PRIORITIES = ["High", "Medium", "Low"];
const PS = {
  High:   { bg: "bg-red-50",    border: "border-red-300",    badge: "bg-red-100 text-red-700" },
  Medium: { bg: "bg-yellow-50", border: "border-yellow-300", badge: "bg-yellow-100 text-yellow-700" },
  Low:    { bg: "bg-green-50",  border: "border-green-300",  badge: "bg-green-100 text-green-700" },
};
const DEFAULT_TAGS = ["CpCX","NetZero","Retention","Ad-hoc","FMX"];
const uid = () => Math.random().toString(36).slice(2,9);
const todayStr = () => new Date().toISOString().split("T")[0];
const isOverdue = d => d && d < todayStr();
const emptyTask = () => ({ id: uid(), title: "", priority: "Medium", dueDate: "", tags: [], notes: "", subtasks: [], files: [], done: false });

function jsonpGet(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    window[cb] = (data) => { delete window[cb]; document.body.removeChild(script); resolve(data); };
    script.onerror = () => { delete window[cb]; document.body.removeChild(script); reject(new Error("JSONP failed")); };
    script.src = url + "?callback=" + cb;
    document.body.appendChild(script);
  });
}

const TagBadge = ({ tag, onRemove }) => (
  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-blue-100 text-blue-700 font-medium">
    {tag}{onRemove && <button onClick={onRemove} className="hover:text-blue-900 font-bold">×</button>}
  </span>
);

const FileChip = ({ file, onRemove }) => (
  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-gray-100 text-gray-700 text-xs">
    📎{file.url
      ? <a href={file.url} target="_blank" rel="noreferrer" className="underline hover:text-blue-600">{file.name||file.url}</a>
      : <span>{file.name}</span>}
    {onRemove && <button onClick={onRemove} className="ml-1 hover:text-red-500 font-bold">×</button>}
  </span>
);

function TaskModal({ task, allTags, onSave, onClose }) {
  const [t, setT] = useState({ ...task, subtasks: task.subtasks.map(s=>({...s})), files: [...task.files], tags: [...task.tags] });
  const [newSub, setNewSub] = useState(""); const [newFileName, setNewFileName] = useState(""); const [newFileUrl, setNewFileUrl] = useState(""); const [tagInput, setTagInput] = useState("");
  const up = (k,v) => setT(p=>({...p,[k]:v}));
  const addSub = () => { if (!newSub.trim()) return; up("subtasks",[...t.subtasks,{id:uid(),text:newSub.trim(),done:false}]); setNewSub(""); };
  const addTag = tag => { if (!tag||t.tags.includes(tag)) return; up("tags",[...t.tags,tag]); setTagInput(""); };
  const addFile = () => { if (!newFileName.trim()&&!newFileUrl.trim()) return; up("files",[...t.files,{id:uid(),name:newFileName.trim()||newFileUrl,url:newFileUrl.trim()}]); setNewFileName(""); setNewFileUrl(""); };
  const sugg = allTags.filter(x=>!t.tags.includes(x)&&x.toLowerCase().includes(tagInput.toLowerCase()));

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:"1rem"}} onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-y-auto" style={{maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}>
        <div className="p-6 space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold text-gray-800">{task.title?"Edit Task":"New Task"}</h2>
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
          </div>
          <input className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" placeholder="Task title *" value={t.title} onChange={e=>up("title",e.target.value)} />
          <div className="flex gap-3">
            <div className="flex-1"><label className="text-xs text-gray-500 font-medium">Priority</label>
              <select className="w-full mt-1 border border-gray-200 rounded-lg px-3 py-2 text-sm" value={t.priority} onChange={e=>up("priority",e.target.value)}>
                {PRIORITIES.map(p=><option key={p}>{p}</option>)}
              </select></div>
            <div className="flex-1"><label className="text-xs text-gray-500 font-medium">Due Date</label>
              <input type="date" className="w-full mt-1 border border-gray-200 rounded-lg px-3 py-2 text-sm" value={t.dueDate} onChange={e=>up("dueDate",e.target.value)} /></div>
          </div>
          <div>
            <label className="text-xs text-gray-500 font-medium">Tags</label>
            <div className="flex flex-wrap gap-1 mt-1 mb-2">{t.tags.map(tag=><TagBadge key={tag} tag={tag} onRemove={()=>up("tags",t.tags.filter(x=>x!==tag))} />)}</div>
            <div style={{position:"relative"}}>
              <input className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" placeholder="Search or add tag..." value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTag(tagInput)} />
              {tagInput&&sugg.length>0&&<div style={{position:"absolute",zIndex:10,width:"100%"}} className="bg-white border border-gray-200 rounded-lg mt-1 shadow-lg">{sugg.map(s=><div key={s} className="px-3 py-2 text-sm hover:bg-blue-50 cursor-pointer" onClick={()=>addTag(s)}>{s}</div>)}</div>}
            </div>
            <div className="flex flex-wrap gap-1 mt-2">{DEFAULT_TAGS.filter(tag=>!t.tags.includes(tag)).map(tag=><button key={tag} onClick={()=>addTag(tag)} className="px-2 py-0.5 text-xs rounded-full border border-blue-200 text-blue-600 hover:bg-blue-50">{tag}</button>)}</div>
          </div>
          <div><label className="text-xs text-gray-500 font-medium">Notes</label>
            <textarea className="w-full mt-1 border border-gray-200 rounded-lg px-3 py-2 text-sm resize-none" rows={3} placeholder="Additional notes..." value={t.notes} onChange={e=>up("notes",e.target.value)} /></div>
          <div><label className="text-xs text-gray-500 font-medium">Subtasks</label>
            <div className="space-y-1 mt-1">{t.subtasks.map(s=>(
              <div key={s.id} className="flex items-center gap-2">
                <input type="checkbox" checked={s.done} onChange={()=>up("subtasks",t.subtasks.map(x=>x.id===s.id?{...x,done:!x.done}:x))} />
                <span className={"text-sm flex-1 "+(s.done?"line-through text-gray-400":"text-gray-700")}>{s.text}</span>
                <button onClick={()=>up("subtasks",t.subtasks.filter(x=>x.id!==s.id))} className="text-gray-300 hover:text-red-400 text-xs font-bold">×</button>
              </div>))}</div>
            <div className="flex gap-2 mt-2">
              <input className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Add subtask..." value={newSub} onChange={e=>setNewSub(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addSub()} />
              <button onClick={addSub} className="px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600">+</button>
            </div></div>
          <div><label className="text-xs text-gray-500 font-medium">Linked Files</label>
            <div className="flex flex-wrap gap-1 mt-1 mb-2">{t.files.map(f=><FileChip key={f.id} file={f} onRemove={()=>up("files",t.files.filter(x=>x.id!==f.id))} />)}</div>
            <div className="flex gap-2">
              <input className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="File name" value={newFileName} onChange={e=>setNewFileName(e.target.value)} />
              <input className="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="URL" value={newFileUrl} onChange={e=>setNewFileUrl(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addFile()} />
              <button onClick={addFile} className="px-3 py-1.5 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600">+</button>
            </div></div>
          <div className="flex justify-end gap-2 pt-2">
            <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
            <button onClick={()=>t.title.trim()&&onSave(t)} className="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700" disabled={!t.title.trim()}>Save Task</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function TaskCard({ task, onToggle, onEdit, onDelete }) {
  const [exp, setExp] = useState(false);
  const s = PS[task.priority]; const ov = !task.done && isOverdue(task.dueDate);
  const subDone = task.subtasks.filter(x=>x.done).length;
  return (
    <div className={"rounded-xl border "+s.border+" "+s.bg+" p-3 shadow-sm space-y-2"}>
      <div className="flex items-start gap-2">
        <input type="checkbox" checked={task.done} onChange={()=>onToggle(task.id)} className="mt-1 cursor-pointer" />
        <div className="flex-1 min-w-0">
          <p className={"text-sm font-semibold leading-tight "+(task.done?"line-through text-gray-400":"text-gray-800")}>{task.title}</p>
          <div className="flex flex-wrap items-center gap-1 mt-1">
            <span className={"text-xs px-1.5 py-0.5 rounded font-medium "+s.badge}>{task.priority}</span>
            {task.dueDate&&<span className={"text-xs px-1.5 py-0.5 rounded font-medium "+(ov?"bg-red-200 text-red-700":"bg-gray-100 text-gray-500")}>{ov?"⚠ ":"📅 "}{task.dueDate}</span>}
            {task.tags.map(tag=><TagBadge key={tag} tag={tag} />)}
          </div>
        </div>
        <div className="flex gap-1 shrink-0">
          <button onClick={()=>onEdit(task)} className="text-gray-400 hover:text-blue-500 text-xs px-1">✏️</button>
          <button onClick={()=>onDelete(task.id)} className="text-gray-400 hover:text-red-500 text-xs px-1">🗑</button>
        </div>
      </div>
      {(task.subtasks.length>0||task.files.length>0||task.notes)&&(
        <button onClick={()=>setExp(p=>!p)} className="text-xs text-gray-400 hover:text-gray-600 pl-6">
          {exp?"▲ hide":"▼ "+[task.subtasks.length&&(subDone+"/"+task.subtasks.length+" subtasks"),task.files.length&&(task.files.length+" file(s)"),task.notes&&"notes"].filter(Boolean).join(" · ")}
        </button>)}
      {exp&&<div className="pl-6 space-y-2">
        {task.subtasks.length>0&&<div className="space-y-1">{task.subtasks.map(s=><div key={s.id} className="flex items-center gap-2 text-xs text-gray-600"><span>{s.done?"☑":"☐"}</span><span className={s.done?"line-through text-gray-400":""}>{s.text}</span></div>)}</div>}
        {task.notes&&<p className="text-xs text-gray-500 italic">{task.notes}</p>}
        {task.files.length>0&&<div className="flex flex-wrap gap-1">{task.files.map(f=><FileChip key={f.id} file={f} />)}</div>}
      </div>}
    </div>
  );
}

function CoworkModal({ onClose }) {
  const prompt = `Every weekday at 9:00 AM, send me a Slack DM with my daily task digest.

Fetch this URL and parse the JSON response:
${SCRIPT_URL}

From the tasks array, compute:
- Overdue tasks: dueDate is before today and done is false — list each by title and dueDate
- Due today: dueDate equals today's date and done is false — list each by title
- High priority open tasks (priority: "High", done: false) — list titles
- Total open tasks (done: false)

Format the message like this:

📋 *Daily Task Digest — [Today's Date]*

🔴 *Overdue* ([count])
• Task title — due [date]

📅 *Due Today* ([count])
• Task title

⚡ *High Priority Open* ([count])
• Task title

✅ Open tasks total: [count]

If a section is empty, omit it. End with: _"Have a great day!"_`;

  const [copied, setCopied] = useState(false);
  const copy = () => { navigator.clipboard.writeText(prompt); setCopied(true); setTimeout(()=>setCopied(false),2000); };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:"1rem"}} onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-y-auto" style={{maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}>
        <div className="p-6 space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold text-gray-800">🤖 Cowork Daily Digest</h2>
            <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
          </div>
          <p className="text-xs text-gray-500">Copy this prompt into a new Cowork scheduled job set to weekdays at 9AM.</p>
          <pre className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-xs text-gray-700 whitespace-pre-wrap leading-relaxed">{prompt}</pre>
          <div className="flex justify-end gap-2">
            <button onClick={onClose} className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Close</button>
            <button onClick={copy} className={"px-4 py-2 text-sm rounded-lg text-white "+(copied?"bg-green-500":"bg-blue-600 hover:bg-blue-700")}>{copied?"✓ Copied!":"Copy Prompt"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tasks, setTasks] = useState([]);
  const [customTags, setCustomTags] = useState([]);
  const [modal, setModal] = useState(null);
  const [showCowork, setShowCowork] = useState(false);
  const [filter, setFilter] = useState({ tag:"", overdue:false, showDone:false });
  const [ghStatus, setGhStatus] = useState("idle");
  const [ghError, setGhError] = useState("");
  const [ghLoaded, setGhLoaded] = useState(false);

  const allTags = [...new Set([...DEFAULT_TAGS,...customTags])];

  useEffect(() => {
    jsonpGet(SCRIPT_URL)
      .then(d => { if (d.ok && Array.isArray(d.tasks) && d.tasks.length > 0) setTasks(d.tasks); })
      .catch(() => {})
      .finally(() => setGhLoaded(true));
  }, []);

  const saveToGitHub = useCallback(async (newTasks) => {
    setGhStatus("saving");
    try {
      const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ tasks: newTasks }) });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || "Unknown error");
      setGhStatus("saved"); setTimeout(() => setGhStatus("idle"), 2000);
    } catch(e) { setGhStatus("error"); setGhError(e.message); setTimeout(() => setGhStatus("idle"), 5000); }
  }, []);

  const updateTasks = useCallback((newTasks) => {
    if (!ghLoaded) return;
    setTasks(newTasks);
    saveToGitHub(newTasks);
  }, [ghLoaded, saveToGitHub]);

  const saveTask = t => {
    const newTags = t.tags.filter(tag => !DEFAULT_TAGS.includes(tag) && !customTags.includes(tag));
    if (newTags.length) setCustomTags(p => [...p, ...newTags]);
    updateTasks(tasks.find(x => x.id === t.id) ? tasks.map(x => x.id === t.id ? t : x) : [...tasks, t]);
    setModal(null);
  };
  const toggleTask = id => updateTasks(tasks.map(t => t.id === id ? {...t, done: !t.done} : t));
  const deleteTask = id => updateTasks(tasks.filter(t => t.id !== id));

  const filtered = tasks.filter(t => {
    if (!filter.showDone && t.done) return false;
    if (filter.tag && !t.tags.includes(filter.tag)) return false;
    if (filter.overdue && !isOverdue(t.dueDate)) return false;
    return true;
  });

  const sorted = [...filtered].sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.dueDate && !b.dueDate) return 0;
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return a.dueDate.localeCompare(b.dueDate);
  });

  const overdueCount = tasks.filter(t => !t.done && isOverdue(t.dueDate)).length;
  const usedTags = [...new Set(tasks.flatMap(t => t.tags))];

  const statusEl = ghStatus==="saving" ? <span style={{fontSize:"0.75rem",color:"#3b82f6"}}>⏳ Saving…</span>
    : ghStatus==="saved" ? <span style={{fontSize:"0.75rem",color:"#16a34a"}}>✓ Saved to GitHub</span>
    : ghStatus==="error" ? <span style={{fontSize:"0.75rem",color:"#ef4444"}} title={ghError}>⚠ {ghError}</span>
    : !ghLoaded ? <span style={{fontSize:"0.75rem",color:"#9ca3af"}}>Loading…</span>
    : <span style={{fontSize:"0.75rem",color:"#9ca3af"}}>● Synced</span>;

  return (
    <div className="min-h-screen bg-gray-50">
      <div className="bg-white border-b border-gray-200 px-4 py-4 sticky top-0 shadow-sm" style={{zIndex:30}}>
        <div className="max-w-2xl mx-auto flex flex-col gap-3">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold text-gray-900">Work Tasks</h1>
              <div className="flex items-center gap-3">
                <p className="text-xs text-gray-400">{tasks.filter(t=>!t.done).length} open · {tasks.filter(t=>t.done).length} done{overdueCount>0?" · ⚠ "+overdueCount+" overdue":""}</p>
                {statusEl}
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setShowCowork(true)} className="px-3 py-2 bg-purple-100 text-purple-700 rounded-xl text-xs font-semibold hover:bg-purple-200">🤖 Cowork</button>
              <button onClick={()=>setModal(emptyTask())} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold hover:bg-blue-700 shadow">+ New Task</button>
            </div>
          </div>
          <div className="flex flex-wrap gap-2 items-center">
            <select className="border border-gray-200 rounded-lg px-2 py-1 text-xs text-gray-600" value={filter.tag} onChange={e=>setFilter(p=>({...p,tag:e.target.value}))}>
              <option value="">All tags</option>
              {usedTags.map(t=><option key={t}>{t}</option>)}
            </select>
            <button onClick={()=>setFilter(p=>({...p,overdue:!p.overdue}))} className={"px-2 py-1 rounded-lg text-xs border "+(filter.overdue?"bg-red-100 border-red-300 text-red-700":"border-gray-200 text-gray-500 hover:bg-gray-100")}>⚠ Overdue</button>
            <button onClick={()=>setFilter(p=>({...p,showDone:!p.showDone}))} className={"px-2 py-1 rounded-lg text-xs border "+(filter.showDone?"bg-gray-200 border-gray-400 text-gray-700":"border-gray-200 text-gray-500 hover:bg-gray-100")}>Show done</button>
          </div>
        </div>
      </div>
      <div className="max-w-2xl mx-auto px-4 py-6">
        <div className="space-y-3">
          {sorted.map(t=><TaskCard key={t.id} task={t} onToggle={toggleTask} onEdit={setModal} onDelete={deleteTask} />)}
          {sorted.length===0&&<p className="text-xs text-gray-400 text-center py-8">{ghLoaded?"No tasks yet":"Loading tasks…"}</p>}
          <button onClick={()=>setModal(emptyTask())} className="w-full text-xs text-gray-400 hover:text-blue-500 py-3 border border-dashed border-gray-200 rounded-xl hover:border-blue-300">+ Add task</button>
        </div>
      </div>
      {modal&&<TaskModal task={modal} allTags={allTags} onSave={saveTask} onClose={()=>setModal(null)} />}
      {showCowork&&<CoworkModal onClose={()=>setShowCowork(false)} />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
